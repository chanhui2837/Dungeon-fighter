services:
  - type: web
    name: dungeon-fighter
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server.app:app --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 8 --timeout 300
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dungeon-fighter-db
          property: connectionString

databases:
  - name: dungeon-fighter-db
    databaseName: dungeon_fighter
    plan: free
